<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArMaly Logística - Cotizador</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
     <!-- xlsx data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #577161;
            --primary-hover: #455a4d;
            --base-bg: #fdfdfb;
            --text-dark: #2d3748;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--base-bg);
            color: var(--text-dark);
        }

        .color-primary-green { background-color: var(--primary-green); }
        .color-primary-hover:hover { background-color: var(--primary-hover); }
        .shadow-custom { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        select:focus, input:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 2px rgba(87, 113, 97, 0.2);
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- NAVEGACIÓN -->
    <nav class="w-full color-primary-green text-white p-4 flex justify-center gap-8 text-lg font-semibold shadow-md">
        <div class="flex items-center gap-2"> 
            <a href="../../index.html">
                <span>🌿</span>
                <span>ArMaly Logística</span>
            </a>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="max-w-4xl mx-auto p-4 py-10">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold color-text-dark">Cotizador Express v3.0</h1>
            <p class="text-gray-500 mt-2">Cálculo de rutas y gestión de riesgos dinámicos</p>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- PANEL DE ENTRADA -->
            <section class="bg-white p-8 rounded-2xl shadow-custom border border-gray-100">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    📍 Datos de Envío
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">CP Origen</label>
                        <input type="text" id="input_origen" value="54070" 
                               class="w-full p-3 border rounded-xl transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">CP Destino</label>
                        <input type="text" id="input_destino" placeholder="Ej. 54010" 
                               class="w-full p-3 border rounded-xl transition">
                    </div>

                    <button onclick="procesarConsulta()" 
                            class="w-full py-4 color-primary-green text-white font-bold rounded-xl shadow-lg color-primary-hover transition transform active:scale-95 mt-4">
                        Calcular Cotización
                    </button>
                </div>
            </section>

            <!-- PANEL DE RESULTADOS -->
            <section id="contenedor_resultado" class="hidden fade-in">
                <div class="bg-white p-8 rounded-2xl shadow-custom border-2 border-dashed border-gray-200 relative">
                    <h2 class="text-2xl font-bold color-text-dark mb-4 text-center">Resumen de Cargo</h2>
                    
                    <div class="border-t border-b py-4 space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-400">Ruta:</span>
                            <span id="res_ruta" class="font-bold"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-400">Tipo de Conexión:</span>
                            <span id="res_tipo" class="font-semibold text-green-700"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-400">Distancia Total:</span>
                            <span id="res_distancia" class="font-semibold"></span>
                        </div>
                    </div>

                    <!-- SELECTOR DE COLONIAS -->
                    <div class="mt-6">
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Seleccionar Asentamiento:</label>
                        <select id="select_colonia" 
                                class="w-full p-3 border rounded-xl bg-gray-50 cursor-pointer">
                            <!-- Opciones dinámicas se cargan aquí -->
                        </select>
                    </div>

                    <!-- DESGLOSE FINAL -->
                    <div class="mt-8 pt-4 border-t-2 border-double border-gray-100">
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-500">Subtotal Base:</span>
                            <span id="res_base" class="font-semibold"></span>
                        </div>
                        <div id="div_riesgo" class="flex justify-between mb-4 text-red-600 hidden">
                            <span class="font-medium flex items-center gap-1">Recargo Zona Roja ⚠️:</span>
                            <span id="res_riesgo" class="font-bold"></span>
                        </div>
                        <div class="flex justify-between items-center pt-2">
                            <span class="text-lg font-bold">TOTAL A COBRAR:</span>
                            <span id="res_total" class="text-4xl font-black text-[#577161]"></span>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <footer class="text-center py-10 text-gray-400 text-sm">
        ArMaly Joyería & Logística &copy; 2025 | Sistema de Control Interno
    </footer>

    <script>
        // --- CONFIGURACIÓN DE BASE DE DATOS ---
        let rutas_db = {};
        let colonias_db = {};
        let costo_base_actual = 0;
    
        /**
         * Carga el archivo JSON desde la raíz del proyecto
         */
        async function cargarBaseDeDatos() {
            try {
                // Buscamos el archivo datos.json en la misma carpeta
                const respuesta = await fetch('datos.json');
                if (!respuesta.ok) throw new Error("No se encontró el archivo datos.json");
                
                const datosCargados = await respuesta.json();
                
                // Organizar los datos para las búsquedas
                procesarEstructura(datosCargados);
                
                console.log("✅ Base de datos JSON cargada correctamente");
            } catch (error) {
                console.error("❌ Error:", error);
                alert("Error: No se pudo cargar 'datos.json'. Asegúrate de que el archivo exista y estés usando un servidor (Firebase o Live Server).");
            }
        }
    
        /**
         * Procesa el array de objetos JSON para acceso rápido
         */
        function procesarEstructura(datos) {
            rutas_db = {};
            colonias_db = {};
    
            datos.forEach(item => {
                const o = String(item.o);
                const d = String(item.d);
                const nombreColonia = `${item.tipo || ''} ${item.nom || ''}`.trim();
    
                // Guardar en diccionario de rutas
                if(!rutas_db[o]) rutas_db[o] = {};
                rutas_db[o][d] = item.km;
    
                // Guardar en diccionario de destinos/colonias
                if(!colonias_db[d]) colonias_db[d] = [];
                colonias_db[d].push({
                    nombre: nombreColonia,
                    riesgo: parseInt(item.riesgo) === 1 ? 15 : 0, // Recargo fijo de $15 si riesgo es 1
                    distancia: parseFloat(item.km)
                });
            });
    
            // Escuchar cambios en el selector de colonias
            document.getElementById('select_colonia').addEventListener('change', actualizarTotal);
        }
    
        /**
         * Ejecuta la búsqueda al presionar el botón
         */
        function procesarConsulta() {
            const cp_o = document.getElementById('input_origen').value.trim();
            const cp_d = document.getElementById('input_destino').value.trim();
            const CP_HUB = "54070"; // Tu centro de operaciones
            
            const data_destino = colonias_db[cp_d];
    
            if (data_destino && data_destino.length > 0) {
                const select = document.getElementById('select_colonia');
                select.innerHTML = ""; // Limpiar opciones previas
                
                // Llenar el select con las colonias encontradas para ese CP
                data_destino.forEach((col) => {
                    const opt = document.createElement('option');
                    opt.value = col.riesgo;
                    opt.setAttribute('data-km', col.distancia); 
                    opt.text = col.nombre;
                    select.appendChild(opt);
                });
    
                // Mostrar el panel de resultados
                document.getElementById('contenedor_resultado').classList.remove('hidden');
                document.getElementById('res_ruta').innerText = `${cp_o} ➔ ${cp_d}`;
                
                // Determinar tipo de conexión
                const esDirecta = (cp_o === CP_HUB || cp_d === CP_HUB);
                document.getElementById('res_tipo').innerText = esDirecta ? "CONEXIÓN DIRECTA" : "RUTA ESTIMADA";
                
                actualizarTotal();
            } else {
                alert("El Código Postal '" + cp_d + "' no está registrado en el sistema.");
            }
        }
    
        /**
         * Calcula y muestra el desglose final de precios
         */
        function actualizarTotal() {
            const select = document.getElementById('select_colonia');
            const optionSeleccionada = select.options[select.selectedIndex];
            
            if(!optionSeleccionada) return;
    
            const recargoRiesgo = parseFloat(optionSeleccionada.value) || 0;
            const km = parseFloat(optionSeleccionada.getAttribute('data-km')) || 0;
            
            // REGLA DE NEGOCIO: $12 por km, mínimo $29
            costo_base_actual = Math.max(km * 12.0, 29.0);
            const totalFinal = costo_base_actual + recargoRiesgo;
            
            // Actualizar Interfaz
            document.getElementById('res_distancia').innerText = `${km.toFixed(2)} km`;
            document.getElementById('res_base').innerText = `$${costo_base_actual.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            document.getElementById('res_total').innerText = `$${totalFinal.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            
            // Mostrar/Ocultar alerta de riesgo
            const divRiesgo = document.getElementById('div_riesgo');
            if (recargoRiesgo > 0) {
                divRiesgo.classList.remove('hidden');
                document.getElementById('res_riesgo').innerText = `+$${recargoRiesgo.toFixed(2)}`;
            } else {
                divRiesgo.classList.add('hidden');
            }
        }
    
        // Iniciar carga automáticamente
        window.onload = cargarBaseDeDatos;
    </script>
</body>
</html>
